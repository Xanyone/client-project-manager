name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        vscode: ['1.140.0', '1.143.1']
    runs-on: ${{ matrix.os }}
    env:
      VSCODE_TEST_VERSION: ${{ matrix.vscode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
        if: runner.os != 'Linux'
      - run: xvfb-run -a npm test
        if: runner.os == 'Linux'
      - run: npm run package:vsix
        if: matrix.os == 'windows-latest' && matrix.vscode == '1.143.1'
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest' && matrix.vscode == '1.143.1'
        with:
          name: extension
          path: '*.vsix'
